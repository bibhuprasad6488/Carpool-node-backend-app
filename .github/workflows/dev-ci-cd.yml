name: Development CI/CD Pipeline

on:
  push:
    branches:
      - development

# Avoid infinite deployment loops caused by workflow commits
concurrency:
  group: dev-deployment
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: 🧪 Pre-Deploy Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Execute Tests
        run: npm test

  release-and-deploy:
    name: 🏷️ Tag Prerelease & Deploy to Render
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits & tags back to repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for tagging tools

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Prerelease Version & Tag
        id: versioning
        run: |
          # Runs standard-version or release-it prerelease bump
          npm run release:dev
          
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$NEW_VERSION" >> $GITHUB_ENV
          echo "Generated version: v$NEW_VERSION"

      - name: Push Commits & Tags to GitHub
        run: |
          # Uses [skip ci] to prevent infinite workflow loops
          git push --follow-tags origin development

      - name: Trigger Render Development Deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "❌ ERROR: RENDER_DEV_DEPLOY_HOOK_URL is missing in repository secrets."
            exit 1
          fi

          echo "🚀 Triggering Render deployment for version ${{ env.VERSION }}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Successfully triggered Render deployment!"
          else
            echo "❌ Failed to trigger Render deployment. HTTP Status: $HTTP_STATUS"
            exit 1
          fi